name: Pipeline Crimes ES

on:
  workflow_dispatch:            # botao "Run workflow" na aba Actions
    inputs:
      force:
        description: "Reprocessar tudo (--force), mesmo sem novidades no site"
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * *"         # todo dia as 06:00 UTC (03:00 em Brasilia)

# So leitura: o estado do manifesto agora fica no Azure, entao o pipeline nao precisa
# dar commit no repositorio (o que permite proteger o ramo main sem quebrar nada).
permissions:
  contents: read

# nunca deixa duas execucoes rodarem ao mesmo tempo (ex: cron + manual)
concurrency:
  group: pipeline-crimes-es
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v7

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # bronze -> silver -> DuckDB -> dbt run -> dbt test -> export (para sozinho se nao ha novidade)
      - name: Rodar pipeline
        run: python -m src.pipeline ${{ inputs.force && '--force' || '' }}

      # Opcional: so avisa se o Secret DISCORD_WEBHOOK_URL existir. O GitHub tambem manda e-mail
      # de falha por conta propria (veja o passo a passo "Alertas").
      - name: Avisar falha no Discord
        if: ${{ failure() }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL nao configurado; pulando o aviso."
            exit 0
          fi
          curl -fsS -X POST -H "Content-Type: application/json" \
            -d "{\"content\": \"Pipeline Crimes ES FALHOU. Detalhes: $RUN_URL\"}" \
            "$DISCORD_WEBHOOK_URL"
