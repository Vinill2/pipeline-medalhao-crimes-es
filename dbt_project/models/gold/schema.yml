version: 2

# Dicionario de dados da camada Gold. Sem testes aqui de proposito: a regra do projeto e que
# apenas no_ocorrencia (na Silver) precisa ser unico e preenchido.
models:
  - name: fct_ocorrencias
    description: >
      Tabela fato: uma linha por ocorrencia. As colunas de texto das dimensoes foram trocadas
      pelos ids numericos (*_id) das tabelas dim_*; datas, horas, idade e codigos passam direto.
    columns:
      - {name: no_ocorrencia, description: Numero da ocorrencia (chave da fato)}
      - {name: data_do_fato, description: Data em que o fato ocorreu}
      - {name: data_de_criacao, description: Data de criacao do boletim}
      - {name: hora_do_fato, description: Hora do fato (HH:MM:SS) ou vazio}
      - {name: hora_de_criacao, description: Hora de criacao do boletim (HH:MM:SS) ou vazio}
      - {name: idade, description: Idade em anos (vazio quando a origem nao informa)}
      - {name: cod_incidente, description: Codigo do incidente, chave para dim_incidente}
      - {name: cod_grupo_incidente, description: Codigo do grupo do incidente}
      - {name: data_carga, description: Quando o dado foi carregado no silver (ISO 8601)}
      - {name: tipo_de_boletim_id, description: "Chave estrangeira para dim_tipo_de_boletim"}
      - {name: agencia_id, description: "Chave estrangeira para dim_agencia"}
      - {name: unidade_id, description: "Chave estrangeira para dim_unidade"}
      - {name: unidade_origem_pc_id, description: "Chave estrangeira para dim_unidade_origem_pc"}
      - {name: uf_id, description: "Chave estrangeira para dim_uf"}
      - {name: municipio_id, description: "Chave estrangeira para dim_municipio"}
      - {name: bairro_id, description: "Chave estrangeira para dim_bairro"}
      - {name: logradouro_id, description: "Chave estrangeira para dim_logradouro"}
      - {name: tipo_de_local_id, description: "Chave estrangeira para dim_tipo_de_local"}
      - {name: cor_id, description: "Chave estrangeira para dim_cor"}
      - {name: meios_id, description: "Chave estrangeira para dim_meios"}
      - {name: sexo_id, description: "Chave estrangeira para dim_sexo"}
      - {name: orientacao_sexual_id, description: "Chave estrangeira para dim_orientacao_sexual"}
      - {name: tipo_objeto_id, description: "Chave estrangeira para dim_tipo_objeto"}
      - {name: acao_objeto_id, description: "Chave estrangeira para dim_acao_objeto"}
      - {name: tipo_id, description: "Chave estrangeira para dim_tipo"}
      - {name: marca_id, description: "Chave estrangeira para dim_marca"}
      - {name: modelo_id, description: "Chave estrangeira para dim_modelo"}
      - {name: cor_veiculo_id, description: "Chave estrangeira para dim_cor_veiculo"}
      - {name: utilidade_do_veiculo_id, description: "Chave estrangeira para dim_utilidade_do_veiculo"}
      - {name: tipo_crime_id, description: "Chave estrangeira para dim_tipo_crime"}
  - name: dim_tipo_de_boletim
    description: >
      Dimensao de tipo de boletim de ocorrencia. Incremental: o id nunca e reatribuido; valores novos
      recebem o proximo numero disponivel.
    columns:
      - {name: tipo_de_boletim_id, description: Id sequencial estavel (chave substituta)}
      - {name: tipo_de_boletim, description: "Valor em texto (tipo de boletim de ocorrencia), maiusculo e sem acento"}
  - name: dim_agencia
    description: >
      Dimensao de agencia (orgao) que registrou a ocorrencia. Incremental: o id nunca e reatribuido; valores novos
      recebem o proximo numero disponivel.
    columns:
      - {name: agencia_id, description: Id sequencial estavel (chave substituta)}
      - {name: agencia, description: "Valor em texto (agencia (orgao) que registrou a ocorrencia), maiusculo e sem acento"}
  - name: dim_unidade
    description: >
      Dimensao de unidade policial de registro. Incremental: o id nunca e reatribuido; valores novos
