    columns:
      - {name: acao_objeto_id, description: Id sequencial estavel (chave substituta)}
      - {name: acao_objeto, description: "Valor em texto (acao sofrida pelo objeto (roubado, furtado...)), maiusculo e sem acento"}
  - name: dim_tipo
    description: >
      Dimensao de tipo (campo generico da origem). Incremental: o id nunca e reatribuido; valores novos
